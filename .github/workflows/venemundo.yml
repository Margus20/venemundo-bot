name: Cerebro Central VeneMundo

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3
      
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Instalar dependencias
      run: pip install requests feedparser
      
    - name: Ejecutar bot VeneMundo
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: python venemundo.py
      
    - name: Guardar memoria de publicaciones
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add vistos_venemundo.txt || true
        git commit -m "Actualizar memoria VeneMundo [skip ci]" || exit 0
        git push
